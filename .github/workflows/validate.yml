name: Validate contribution

# Checks every pull request. A pull request that only adds or changes files under ledger/ and passes is merged
# automatically, its claim is closed, and the inventory is rebuilt. Anything else waits for a maintainer.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: contributions
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Check out the branch's own tip, not GitHub's merge commit: the overlap check compares what main gained
      # since the branch started, and on the merge commit that difference is always empty.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Self-test of the checks themselves
        run: python scripts/selftest.py
      - name: Ledger files added by this PR, and overlap with main
        run: |
          git fetch origin "${{ github.base_ref }}"
          python scripts/validate.py --changed --against "origin/${{ github.base_ref }}"
      - name: The whole ledger still replays once merged
        run: |
          git config user.name ci
          git config user.email ci@example.invalid
          git merge --no-edit "origin/${{ github.base_ref }}" || { echo "This branch conflicts with main: update it (git pull origin main) and push again"; exit 1; }
          python scripts/build.py
      - name: Merge if it is a ledger-only contribution
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          OTHER=$(gh pr diff "$PR" --name-only | grep -v '^ledger/' || true)
          if [ -n "$OTHER" ]; then
            echo "Not merging automatically: this PR also changes files outside ledger/ (a maintainer reviews those):"
            echo "$OTHER"
            exit 0
          fi
          CLAIMS=$(gh pr view "$PR" --json closingIssuesReferences --jq '.closingIssuesReferences[].number')
          gh pr merge "$PR" --squash --delete-branch
          for n in $CLAIMS; do gh issue close "$n" --comment "Submitted in #$PR. Anything not finished is back in the queue." || true; done
          gh workflow run build.yml --ref main
