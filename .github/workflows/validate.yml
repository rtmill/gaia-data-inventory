name: Validate contribution

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ledger files added by this PR
        run: python scripts/validate.py --changed --against origin/${{ github.base_ref }}
      - name: The whole ledger still replays
        run: python scripts/build.py
